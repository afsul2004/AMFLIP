<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | AMFLIP</title>

    <link rel="stylesheet" href="loginpage.css">
</head>

<body>

    <div class="background">
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
    </div>

    <main class="login-container">

        <section class="login-card">

            <div class="brand">
                <div class="logo">AMFLIP</div>

                <h1>Forgot Password?</h1>

                <p>Enter your email to reset your password</p>
            </div>

            <form onsubmit="resetPassword(event)">

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input type="email" id="email" placeholder="Enter your registered email" required>
                </div>

                <div class="input-group">
                    <label for="password">New Password</label>

                    <input type="password" id="password" placeholder="Enter new password" required>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="login-btn">
                    Reset Password
                    <span>→</span>
                </button>

                <p id="result"></p>

            </form>

            <p class="signup">
                Remember your password?
                <a href="./loginpage.html">Sign In</a>
            </p>

        </section>

    </main>


    <script>

        async function resetPassword(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const confirmPassword = document.getElementById("confirmPassword").value.trim();
            const result = document.getElementById("result");


            // Check passwords
            if (password !== confirmPassword) {

                result.innerText = "Passwords do not match";
                return;
            }
            if (password.length < 6) {

                result.innerText =
                    "Password must contain at least 6 characters";

                return;
            }
            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/forgot-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );
                const data = await response.json();
                console.log(data);
                
                if (data.message) {
                    result.innerText = data.message;
                    if (data.message === "Password updated successfully") {

                        setTimeout(function () {

                            window.location.href = "loginpage.html";

                        }, 1000);                        
                    }
                } 
                else{
                    result.innerText = "Something went wrong";
                }
            } catch (error) {
                console.error(error);
                result.innerText =
                    "Unable to connect to server";
            }
        }

    </script>

</body>

</html>
